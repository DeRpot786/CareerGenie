spring:
  application:
    name: career-genie

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/careergenie?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:careergenie}
    password: ${SPRING_DATASOURCE_PASSWORD:careergenie123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

app:
  jwt:
    secret: ${JWT_SECRET:Y2FyZWVyZ2VuaWVzZWNyZXRrZXlmb3Jqd3Rfc2lnbmluZ19wdXJwb3Nlc29ubHk=}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}

  upload:
    photo-dir: uploads/photos

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
